services:
  db:
    image: docker.io/library/busybox:latest
    command: ["sleep", "3600"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 5s
      retries: 3
      start_period: 0s
  migrate:
    image: docker.io/library/busybox:latest
    command: ["/bin/sh", "-c", "exit 7"]
    depends_on:
      db:
        condition: service_healthy
  api:
    image: docker.io/library/busybox:latest
    command: ["sleep", "3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully

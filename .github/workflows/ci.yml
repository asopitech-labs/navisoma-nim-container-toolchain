name: MVP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify fixed toolchain
        run: |
          nim --version
          nimble --version
          nim --version | grep -Eq '^Nim Compiler Version 2\.2\.10( |$)'
          nimble --version | grep -Eq '^nimble v0\.22\.2 '
      - run: nimble test -Y
      - run: bash -n tests/differential/docker-compose/run.sh
      - run: git diff --check
